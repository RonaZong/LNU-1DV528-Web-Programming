<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Personal Web Desktop</title>
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/window.css">
        <link rel="stylesheet" href="css/memory.css">
        <link rel="stylesheet" href="css/chat.css">
        <link rel="stylesheet" href="css/quiz.css">
    </head>
    <body>
        <div id="desktop">
            <div class="desktop-icons">
                <div class="desktop-icon" data-app="memory">
                    <img src="assets/memory-game.png" alt="Memory Game">
                    <span>Memory Game</span>
                </div>
                <div class="desktop-icon" data-app="chat">
                    <img src="assets/bubble-chat.png" alt="Chat">
                    <span>Chat</span>
                </div>
                <div class="desktop-icon" data-app="custom">
                    <img src="assets/quiz.png" alt="Quiz">
                    <span>Quiz</span>
                </div>
            </div>
        </div>
        <script type="module" src="js/main.js"></script>
    </body>
</html>
