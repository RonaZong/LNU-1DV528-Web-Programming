<script data-role="slide" data-markdown type="text/html">
# DOM

* Browser has Window object, representing the browser environment in the global variable `window`
* The current `window` has a property `document` containing all nodes of the current document.
* The variable `document` is also available as a global one.
* Through `document` all parts of the document nodes/elements can be accessed.

</script>



<script data-role="slide" data-markdown type="text/html">
# DOM usage

```
a = document.getElementsByTagName("body")
a // inspect a
a[0].innerHTML = "A"
a[0].style // Read only property
a[0].style.backgroundColor = "blue"
a[0].style.color = "white"
```

</script>

<script data-role="slide" data-markdown type="text/html">
# Object this
<pre data-code="c7"></pre>
</script>

<script id="c7" data-role="code" data-language="javascript" type="text/html">
/* Draw element in HTML using access to this */
myBall.HTMLelement = document.getElementById('ball');

myBall.draw = function () {
    this.HTMLelement.style.backgroundImage = 'url(' + this.image + ')';
    this.HTMLelement.style.top = this.position.y + 'px';
    this.HTMLelement.style.left = this.position.x + 'px';
    console.log('Drawing ball.');
}

myBall.draw();
</script>



<script data-role="slide" data-markdown type="text/html">
# Object this, event
<pre data-code="c71"></pre>
</script>

<script id="c71" data-role="code" data-language="javascript" type="text/html">
/* This is the HTML element, not myBall */
myBall.HTMLelement.addEventListener('click', function (event) {
    console.log('Clicked on: ' + event.clientX + ' x ' + event.clientY);
    console.log(this);
});
</script>
