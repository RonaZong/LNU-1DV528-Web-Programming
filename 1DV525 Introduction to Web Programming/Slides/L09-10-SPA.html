<script data-role="slide" data-markdown type="text/html">
# Web components

* Custom elements with behaviour (set of API)
* Shadow DOM (encapsulate element DOM tree)
* HTML templates (not visible, but reusable)
    * `<template>`, `<slot>`

</script>



<script data-role="slide" data-markdown type="text/html">
# Web components howto

* Create ES6 Class for the component functionality
* Register it `CustomElementRegistry.define()`
* Attach a shadow DOM `Element.attachShadow()`
* Define a HTML template
* Use your custom element, as a ordinary HTML element

</script>
