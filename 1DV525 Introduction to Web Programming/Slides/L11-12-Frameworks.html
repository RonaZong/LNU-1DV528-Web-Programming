<script data-role="slide" data-markdown type="text/html">
# Framework architectures

* MVC - Model-View-Controller
* MVVM - Model-View-ViewModel
* MVP - Model-View-Presenter

</script>



<script data-role="slide" data-markdown type="text/html">
# MVC - Model-View-Controller

* Model - data of the application.
* View - the user interface of the app.
* Controller - handles all input (for example, clicks or browser events)

</script>



<script data-role="slide" data-markdown type="text/html">
# MVVM - Model-View-ViewModel

* Model - data of the application.
* View - the user interface of the app.
* ViewModel - similar to a Controller, but acts as a data converter because it passes commands from the View to the Model.

</script>



<script data-role="slide" data-markdown type="text/html">
# MVP - Model-View-Presenter

* Model - data of the application.
* View - the user interface of the app.
* Presenter - responsible for the logic of widgets’ functionality (for example, data storage and loading, app events, data manipulation, etc.)

</script>

const element = <h1>Hello, {name}</h1>;

  element,
  document.getElementById('root')
);
```

<script data-role="slide" data-markdown type="text/html">

# Virtual DOM nodes

* A virtual DOM tree is a JavaScript data structure that describes a DOM tree.
* It consists of nested virtual DOM nodes, also known as vnodes.
* Mithril diffs a vnode tree against its previous version and only modifies DOM elements in spots where there are changes.

</script>



<script data-role="slide" data-markdown type="text/html">

# Components

* Components are a mechanism to encapsulate parts of a view to make code easier to organize and/or reuse.

```
// define your component
var Example = {
    view: function(vnode) {
        return m("div", "Hello")
    }
}

// consume your component
m(Example)
```

</script>



<script data-role="slide" data-markdown type="text/html">

# Lifecycle methods

* Components and virtual DOM nodes can have lifecycle methods, also known as hooks, which are called at various points during the lifetime of a DOM element.
* oninit, oncreate, onupdate and more

</script>



<script data-role="slide" data-markdown type="text/html">

# Keys

*  A key is a way of saying "this DOM element is for the data object with this id"

</script>



<script data-role="slide" data-markdown type="text/html">

# Auto-redraw system

* Mithril employs an auto-redraw system that synchronizes the DOM whenever changes are made in the data layer.

</script>



<script data-role="slide" data-markdown type="text/html">

# Small footprint

* [Small API](https://mithril.js.org/api.html)
