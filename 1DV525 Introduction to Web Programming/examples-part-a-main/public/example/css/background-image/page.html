<!doctype html>
<meta charset="utf8">
<style>

    :root {
        --image: url(../img/html_logo.png);
    }

    .box {
        float: left;
        width: 600px;
        height: 400px;
        border: 4px solid lime;
        background-image: var(--image);
        margin: 1em;
    }

    .fixed {
        background-repeat: no-repeat;
        background-position: center;
    }

    .cover {
        background-size:cover;
    }

</style>

<div class="box">And some text</div>
<div class="box fixed">And some text</div>
<div class="box fixed cover">And some text</div>
