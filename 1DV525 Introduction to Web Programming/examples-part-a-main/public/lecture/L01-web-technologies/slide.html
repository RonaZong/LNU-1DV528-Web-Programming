<script data-role="slide" type="text/html" data-markdown class="titlepage center">
# URL
## Uniform Resource Locator
### or "a web address"
</script>



<script data-role="slide" type="text/html" data-markdown>
# URL

* Uniform Resource Locator

```
scheme:[//authority]path[?query][#fragment]

authority = [userinfo@]host[:port]
```

</script>



<script data-role="slide" type="text/html" data-markdown>
# A web address

```
scheme:[//[userinfo@]host[:port]]path[?query][#fragment]

https://www.google.se/
https://www.google.se/search?q=www&browser=firefox

http://localhost/index.html#section2
http://127.0.0.1:8080/hello_world.php

http://username:password@example.com/
```

</script>



<script data-role="slide" type="text/html" data-markdown>
# A web address...

```
scheme://server/path?query#fragment
```

* `scheme`: http or https (ftp, file, data, ...)
* `host`: antagning.se, svt.se
    * http is port 80, https is port 443
    * svt.se:8080 connects to another port
* `path`: path to resource or filename, index.html or img/me.png
* `?query`: querystring as key=value&key1=value
* `#fragment`: a unique id within the (html) document

</script>



<script data-role="slide" type="text/html" data-markdown>
# URL summary

* Uniform Resource Locator
* Address to reach a resource

```
scheme://server:port/path?query#fragment
```

</script>

# The protocol
## HTTP/HTTPS
### Hypertext Transfer Protocol

<script data-role="slide" type="text/html" data-markdown>
# HTTP protocol

* Hypertext Transfer Protocol
* A stateless textbased protocol
    * Request
    * Response
    * Header & Body
* Client-server protocol
    * Client ~= Web browser (or application)
    * Server ~= Web server (or just server)

</script>



<script data-role="slide" type="text/html" data-markdown>
# HTTP versions

* Application level protocol (over TCP, TLS, QUIC)
* 1996: HTTP/1.0
* 1997: HTTP/1.1 (updated 1999, 2014, 2022)
* 2015: HTTP/2 ("more efficient")
    * Used by 45% of the websites and supported by "all" web browsers.
* 2022: HTTP/3 ("faster, lower latency")
    * Supported by 25% of the websites and 75% of the users (browsers).
    * Uses QUIC transport layer network protocol instead of TCP

<p class="footnote">https://en.wikipedia.org/wiki/Hypertext_Transfer_Protocol (checked 2022)</p>

</script>



<script data-role="slide" type="text/html" data-markdown>
# HTTPS

* HTTPS is secure HTTP
* Available since 1994
* Provide the "identity" of the website though certificates
* Let's Encrypt is a free service to get a certificate for your website
* In 2018 Google announced "use HTTPS or drop in the search index"
* More than 80% of the websites use HTTPS (Wikipedia 2022).

</script>



<script data-role="slide" type="text/html" data-markdown>
# Request (HEADER)

```
GET / HTTP/1.1
Host: www.example.com
User-Agent: Mozilla/5.0
Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8
Accept-Language: en-GB,en;q=0.5
Accept-Encoding: gzip, deflate, br
Connection: keep-alive
```

</script>



<script data-role="slide" type="text/html" data-markdown>
# Response

```
HTTP/1.1 200 OK
Date: Mon, 23 May 2005 22:38:34 GMT
Content-Type: text/html; charset=UTF-8
Content-Length: 155
Last-Modified: Wed, 08 Jan 2003 23:11:55 GMT
Server: Apache/1.3.3.7 (Unix) (Red-Hat/Linux)
ETag: "3f80f-1b6-3e1cb03b"
Accept-Ranges: bytes
Connection: close

<html>
  <head>
    <title>An Example Page</title>
  </head>
  <body>
    <p>Hello World, this is a very simple HTML document.</p>
  </body>
</html>
```

</script>
